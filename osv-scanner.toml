[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "ReDoS in brace-expansion, transitive via @actions/cache -> @actions/glob -> minimatch@3.x (requires brace-expansion@^1.x; fixed version 5.0.8 is incompatible). Not exploitable here: all brace patterns are hardcoded internal paths (e.g. .foundry/), never user-controlled input. Worst-case impact is a slow CI job, not a production compromise."
